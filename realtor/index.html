<style>
:root {
  --bg-top: #151412; --bg-bot: #000000;
  --accent: #d9b877; --accent-2: #b8914e; --on-accent: #1a1206;
  --fg: #ffffff; --muted: #c9c3b8; --line: #3a3226; --tile: rgba(217,184,119,.07);
  --name: Archivo, 'Arial Black', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: linear-gradient(var(--bg-top), var(--bg-bot) 60%) fixed, var(--bg-bot);
  color: var(--fg);
  font: 16px/1.35 Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
main {
  max-width: 460px; margin: 0 auto;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; gap: 10px;
  padding-top: 0;
  padding-bottom: max(14px, env(safe-area-inset-bottom));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
}
.photo {
  flex: 1 1 0; min-height: 180px; max-height: 264px; position: relative; overflow: hidden;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-right))) 0 calc(-1 * max(16px, env(safe-area-inset-left)));
  -webkit-mask-image: linear-gradient(#000 58%, transparent 96%);
          mask-image: linear-gradient(#000 58%, transparent 96%);
}
/* Blurred copy fills the width; the sharp headshot sits centered on top so
   the face stays small on every phone instead of zooming to fill the box.
   It is anchored to the bottom (bottom 20% tucked under the edge) so the chin
   always clears the name. Capped at 330px tall (264px visible, which is the
   box max-height) so big phones never zoom the face or show the blur above it. */
.photo .bg { position: absolute; top: -30px; left: -30px; width: calc(100% + 60px); height: calc(100% + 60px); object-fit: cover; filter: blur(22px) brightness(.55) saturate(.8); }
.photo .fg {
  position: absolute; bottom: 0; left: 50%; transform: translate(-50%, 20%);
  height: min(125%, 330px); width: auto; max-width: none;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent);
          mask-image: linear-gradient(90deg, transparent, #000 16%, #000 84%, transparent);
}
/* Taller phones: photo hits its max height, the stack centers, and the photo's
   top edge fades too so it floats instead of showing a hard line. */
@media (min-height: 640px) {
  main { justify-content: center; padding-top: max(12px, env(safe-area-inset-top)); }
  .photo { -webkit-mask-image: linear-gradient(transparent, #000 10%, #000 58%, transparent 96%);
                   mask-image: linear-gradient(transparent, #000 10%, #000 58%, transparent 96%); }
}
h1 {
  margin: -1.15em 0 0; text-shadow: 0 2px 14px rgba(0,0,0,.55); position: relative; z-index: 1; text-align: center;
  font-family: var(--name); font-weight: 600; letter-spacing: .06em;
  font-size: clamp(30px, 9vw, 42px); line-height: 1; text-transform: uppercase;
}
.rule { width: 120px; height: 2px; margin: 2px auto 0; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.tagline {
  margin: 0; text-align: center; text-transform: uppercase;
  font-size: 12.5px; letter-spacing: .2em; color: var(--fg);
}
.save {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 54px; border-radius: 14px; margin-top: 2px;
  background: linear-gradient(var(--accent), var(--accent-2));
  color: var(--on-accent); font-weight: 600; font-size: 18px; text-decoration: none;
}
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; }
.row a {
  display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--tile);
  color: var(--fg); text-decoration: none; font-size: 16px; min-width: 0;
}
.row a.wide { flex: 1; }
.row a.wide span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row a.sq { flex: 0 0 auto; justify-content: center; padding: 0 16px; font-size: 14px; gap: 8px; }
.row a.site span { color: var(--accent); font-weight: 500; }
svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.save svg { stroke: var(--on-accent); stroke-width: 2; }
footer { display: flex; align-items: center; justify-content: center; gap: 18px; padding-top: 0; }
.team { margin: 0; font-family: 'Alex Brush', cursive; white-space: nowrap; font-size: 32px; line-height: 1; color: #ffffff; font-weight: 400; }
.logo { height: 60px; width: auto; }
.logo.pb { height: 30px; }
.hint {
  margin: -4px 0 0; text-align: center; font-size: 13px; line-height: 1.3; color: var(--muted);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.hint[hidden] { display: none; }
.hint b { color: var(--fg); font-weight: 600; }
.hint svg { width: 15px; height: 15px; stroke: var(--accent); stroke-width: 2.2; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a:active { transform: scale(.98); }
@media (max-height: 640px) { .team { font-size: 28px; } .logo { height: 50px; } .logo.pb { height: 24px; } h1 { font-size: clamp(28px, 8vw, 36px); } }
/* Wider than a phone (desktop, tablet): the photo box no longer reaches the
   screen edges, so fade its sides too instead of showing hard vertical lines. */
@media (min-width: 500px) {
  .photo {
    -webkit-mask-image: linear-gradient(transparent, #000 10%, #000 58%, transparent 96%), linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
            mask-image: linear-gradient(transparent, #000 10%, #000 58%, transparent 96%), linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
    -webkit-mask-composite: source-in; mask-composite: intersect;
  }
}
@media (max-height: 600px) { .row a { min-height: 44px; } .save { min-height: 50px; } main { gap: 8px; } }
